logging:
  level: "DEBUG"
  console:
    enabled: true
    level: "INFO"
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  file:
    enabled: true
    level: "DEBUG"
    path: "logs/app.log"
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(filename)s:%(lineno)d | %(message)s"
    max_bytes: 10485760  # 10 MB
    backup_count: 5